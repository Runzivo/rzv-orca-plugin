name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: rzv-ubuntu-24.04-x64-2vcpu-8gb
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recipes match their generator
        run: scripts/10-build-recipes.sh && git diff --exit-code recipes/
      - name: Recipes and manifest are valid JSON
        run: for f in orca-plugin.json recipes/*.json; do python3 -I -m json.tool "$f" >/dev/null; done
      - name: Shell scripts
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck scripts/*.sh
